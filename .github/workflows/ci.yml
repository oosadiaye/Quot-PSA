name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  # ═════════════════════════════════════════════════════════════════════
  # Backend — Django + pytest + ruff + bandit
  # ═════════════════════════════════════════════════════════════════════
  backend:
    name: Backend (Django + pytest)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: quot
          POSTGRES_PASSWORD: quot
          POSTGRES_DB: quot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quot -d quot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: quot_pse.settings
      # settings.py reads discrete DB_* variables (settings.py:157-161);
      # it never looks at DATABASE_URL. With only DATABASE_URL set,
      # os.getenv falls back to its defaults — database quot_pse, user
      # dtsg, empty password — and Django dies with
      # "fe_sendauth: no password supplied" against a service that
      # actually created quot_test/quot. These must match that service.
      DB_NAME: quot_test
      DB_USER: quot
      DB_PASSWORD: quot
      DB_HOST: localhost
      DB_PORT: "5432"
      # Must be the literal "True": settings.py:36 parses DEBUG with a
      # strict `os.getenv('DEBUG', 'False') == 'True'`, so "1" reads as
      # False and CI silently ran in non-DEBUG mode — which is what made
      # snapshots.E001 a hard ERROR instead of a warning. Left strict on
      # purpose: DEBUG governs whether stack traces are served, so a
      # parser that fails closed is the safer one to keep.
      DEBUG: "True"
      SECRET_KEY: ci-insecure-key-not-for-prod
      ALLOWED_HOSTS: "*"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      # Install from requirements.txt, not a hand-listed subset. The
      # inline list this replaced had drifted: it pinned Django 4.2,
      # which requirements.txt documents as too old for django-tenants
      # 3.10 and the 5.x model features in use, and it omitted
      # python-dotenv, drf-spectacular, cryptography, numpy and pandas —
      # all imported at app-registry boot, so `manage.py check` died
      # before a single test ran. It also installed reportlab, which the
      # codebase never imports. The e2e job already installs this way;
      # the two jobs now agree.
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── Linters + security (advisory on main; enforced on PRs once clean)
      - name: Lint (ruff)
        run: ruff check accounting budget procurement core --select E,F,W --ignore E501
        continue-on-error: true

      - name: Security scan (bandit)
        run: bandit -r accounting budget core -ll -q
        continue-on-error: true

      # ── Hard gates
      - name: Django system check
        run: python manage.py check

      - name: Migration consistency
        run: python manage.py makemigrations --check --dry-run

      # ── Fast-tier tests (no-DB, must pass)
      - name: Pytest — no-DB fast tier
        run: |
          pytest \
            superadmin/tests/test_ai_foundation.py \
            superadmin/tests/test_ai_models.py \
            superadmin/tests/test_ai_client.py \
            core/tests/test_ai_tenant_view.py \
            accounting/tests/test_ai_reconciliation.py \
            procurement/tests/test_split_detection.py \
            contracts/tests/test_duplicate_detection.py \
            accounting/tests/test_allocation_guard.py \
            accounting/tests/test_grir_not_postable.py \
            accounting/tests/test_ncoa_series_compliance.py \
            accounting/tests/test_ncoa_renumbering.py \
            accounting/tests/test_s14*.py \
            accounting/tests/test_s15*.py \
            accounting/tests/test_s16*.py \
            accounting/tests/test_s17*.py \
            accounting/tests/test_s18*.py \
            accounting/tests/test_s19*.py \
            accounting/tests/test_s20*.py \
            accounting/tests/test_s21*.py \
            accounting/tests/test_s25*.py \
            core/tests/test_s23*.py \
            core/tests/test_s24*.py \
            -v \
            --cov=accounting --cov=core --cov=budget \
            --cov-report=xml \
            --cov-report=term

      # ── Database tier. Kept separate from the fast tier above, which
      # is genuinely no-DB — none of the modules listed there touch the
      # ORM. The budget suites do: budget_appropriation lives in
      # TENANT_APPS, so budget/tests/conftest.py builds pytest_schema and
      # migrates the tenant apps into it before anything runs.
      #
      # Without this step these four files never execute in CI. They
      # cover the budget code contract and the nearest-line matching rule
      # that decides which appropriation a posting depletes — wrong
      # answers there read as ordinary numbers, which is exactly the kind
      # of defect a test has to catch because nobody will notice it.
      - name: Pytest — database tier (budget)
        run: |
          pytest \
            budget/tests/ \
            -v \
            --cov=budget \
            --cov-append \
            --cov-report=xml \
            --cov-report=term

      # ── Database tier (AP centralisation). These live in TENANT_APPS
      # (accounting, contracts), so their conftests build pytest_schema and
      # migrate the tenant apps before running. They cover the milestone-as-
      # invoice accrual + retention lien, central payment processing
      # (deduction-aware PV → draft Payment → post), and the AP-register
      # Create-PV factory (payable_now, retention never disbursed). These were
      # invisible to CI before — the fast tier is genuinely no-DB and the file
      # allowlist never listed them, so the whole AP/PV/milestone surface went
      # ungated. transaction=True posted-journal tests need a real DB.
      - name: Pytest — database tier (AP / payments / contracts)
        run: |
          pytest \
            accounting/tests/test_pv_factory_invoice.py \
            accounting/tests/test_central_payment_processing.py \
            contracts/tests/test_milestone_invoice.py \
            -v \
            --cov=accounting --cov=contracts \
            --cov-append \
            --cov-report=xml \
            --cov-report=term

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage.xml
          if-no-files-found: ignore

  # ═════════════════════════════════════════════════════════════════════
  # Frontend — TypeScript check + build
  # ═════════════════════════════════════════════════════════════════════
  frontend:
    name: Frontend (TypeScript + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # `tsc -b` (build mode), not bare `tsc`. The root tsconfig.json is
      # a Vite project-references stub — "files": [] plus references to
      # tsconfig.app.json / tsconfig.node.json — so `tsc --noEmit` reads
      # it, finds zero files, and exits 0 without checking anything.
      # Only build mode follows the references.
      - name: TypeScript check
        run: npx tsc -b --noEmit

      # ── The Playwright specs, type-checked.
      # tsconfig.app.json includes only `src`, so nothing checked e2e/ at
      # all: a spec could call a Locator method that does not exist, or
      # import a fixture export that was renamed, and the step above
      # stayed green. The Playwright job cannot be relied on to catch it
      # either — it exits 0 with a warning when E2E_USER is unset, so a
      # broken spec had two ways to look like a passing one.
      - name: TypeScript check (e2e suite)
        run: npm run typecheck:e2e

      - name: Build (production bundle)
        run: npm run build

      - name: Upload bundle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          if-no-files-found: ignore

  # ═════════════════════════════════════════════════════════════════════
  # End-to-end (Playwright) — exercises the full Django + Vite stack
  # against a seeded test tenant. Requires repo secrets:
  #   E2E_USER, E2E_PASSWORD       — test login (must exist in CI tenant)
  #   E2E_TENANT_DOMAIN            — tenant domain for X-Tenant-Domain header
  #   E2E_TENANT_SCHEMA            — django-tenants schema name
  #   E2E_APPROPRIATION_ID         — id of an active appropriation in tenant
  # The "Run Playwright suite" step skips at runtime when E2E_USER is
  # empty (see `if:` on that step) so PRs from forks without secrets
  # don't fail noisily.
  # ═════════════════════════════════════════════════════════════════════
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: quot
          POSTGRES_PASSWORD: quot
          POSTGRES_DB: quot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U quot -d quot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: quot_pse.settings
      # settings.py reads discrete DB_* variables (settings.py:157-161);
      # it never looks at DATABASE_URL. With only DATABASE_URL set,
      # os.getenv falls back to its defaults — database quot_pse, user
      # dtsg, empty password — and Django dies with
      # "fe_sendauth: no password supplied" against a service that
      # actually created quot_test/quot. These must match that service.
      DB_NAME: quot_test
      DB_USER: quot
      DB_PASSWORD: quot
      DB_HOST: localhost
      DB_PORT: "5432"
      # Must be the literal "True": settings.py:36 parses DEBUG with a
      # strict `os.getenv('DEBUG', 'False') == 'True'`, so "1" reads as
      # False and CI silently ran in non-DEBUG mode — which is what made
      # snapshots.E001 a hard ERROR instead of a warning. Left strict on
      # purpose: DEBUG governs whether stack traces are served, so a
      # parser that fails closed is the safer one to keep.
      DEBUG: "True"
      SECRET_KEY: ci-insecure-key-not-for-prod
      ALLOWED_HOSTS: "*"
      # Loosen rates so the suite (which makes ~80 API calls) doesn't
      # trip the production-strict throttle.
      USER_THROTTLE_RATE: 20000/hour
      ANON_THROTTLE_RATE: 2000/hour
      LOGIN_THROTTLE_RATE: 120/min

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Migrate (shared + tenant schemas)
        run: |
          python manage.py migrate_schemas --shared
          python manage.py migrate_schemas --tenant || true

      - name: Seed E2E tenant + dimensions + appropriation + vendor
        env:
          E2E_TENANT_SCHEMA: ${{ secrets.E2E_TENANT_SCHEMA || 'ci_e2e' }}
          E2E_TENANT_DOMAIN: ${{ secrets.E2E_TENANT_DOMAIN || 'ci_e2e.dtsg.test' }}
          E2E_USER: ${{ secrets.E2E_USER || 'ci_admin' }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD || 'Insecure-CI-1234' }}
        run: |
          python manage.py seed_e2e_tenant \
            --schema="$E2E_TENANT_SCHEMA" \
            --domain="$E2E_TENANT_DOMAIN" \
            --username="$E2E_USER" \
            --password="$E2E_PASSWORD" | tee seed-output.json
          # Extract appropriation_id for the test runner.
          echo "E2E_APPROPRIATION_ID=$(python -c 'import json; print(json.load(open(\"seed-output.json\"))[\"appropriation_id\"])')" >> $GITHUB_ENV

      - name: Start Django
        run: nohup python manage.py runserver 0.0.0.0:8000 --noreload > backend.log 2>&1 &

      - name: Start Vite
        run: nohup npm run dev -- --host 0.0.0.0 > vite.log 2>&1 &
        working-directory: frontend

      - name: Wait for servers
        run: |
          npx wait-on tcp:8000 tcp:5173 --timeout 60000
        working-directory: frontend

      - name: Run Playwright suite
        env:
          E2E_BASE_URL: http://localhost:5173
          E2E_API_URL: http://localhost:8000
          E2E_USER: ${{ secrets.E2E_USER }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_TENANT_DOMAIN: ${{ secrets.E2E_TENANT_DOMAIN }}
          E2E_APPROPRIATION_ID: ${{ secrets.E2E_APPROPRIATION_ID }}
        run: |
          if [ -z "$E2E_USER" ]; then
            echo "::warning::E2E_USER secret not set — skipping Playwright run."
            exit 0
          fi
          npx playwright test
        working-directory: frontend

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload server logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-logs
          path: |
            backend.log
            frontend/vite.log
          if-no-files-found: ignore

  # ═════════════════════════════════════════════════════════════════════
  # Secret scan
  # ═════════════════════════════════════════════════════════════════════
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Allow the job to advisory-fail on the first run so existing
          # low-severity findings don't block the rollout. Flip to
          # GITLEAKS_EXIT_CODE=1 once the baseline is clean.
          GITLEAKS_EXIT_CODE: "0"
