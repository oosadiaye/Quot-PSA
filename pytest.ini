[pytest]
DJANGO_SETTINGS_MODULE = quot_pse.settings
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Test discovery scope: only our first-party app tests. Avoids picking
# up tests bundled with third-party packages in .venv and stubbed
# sales/production apps.
testpaths =
    accounting/tests
    budget/tests
    contracts/tests
    procurement/tests
    snapshots/tests
    # Only the files known green: the rest of core/tests has two stale
    # source-inspection tests (test_pass10_budget_contracts) that need fixing first.
    core/tests/test_user_mda_assignment.py
    core/tests/test_team_chat.py
    core/tests/test_logout.py
    core/tests/test_module_gating.py
    debt/tests
    budget_prep/tests
    personnel_budget/tests
    cash_planning/tests
    transparency/tests

# Always print short tracebacks + one-line failure summary. Treat
# warnings as errors only for our own code (keeps third-party
# deprecation noise out).
addopts =
    -ra
    --tb=short
    --strict-markers
    --strict-config
    -p no:warnings

markers =
    unit: pure-Python unit tests with no DB or I/O dependencies
    integration: tests that hit the DB and run inside a tenant schema
    slow: tests that take > 1 second (kept out of pre-commit fast lane)
    ipsas: IPSAS-compliance regression tests
    audit: audit-trail hardening regression tests
